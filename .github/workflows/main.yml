name: Create YouTube Plus or MaxTube app

on:
  workflow_dispatch:
    inputs:
      enable_youpip:
        description: "Integrate YouPiP"
        type: boolean
        required: true
        default: false

      enable_ytuhd:
        description: "Integrate YTUHD"
        type: boolean
        required: true
        default: false

      enable_yq:
        description: "Integrate YouQuality"
        type: boolean
        required: true
        default: false

      enable_ryd:
        description: "Integrate Return YouTube Dislikes"
        type: boolean
        required: true
        default: false

      enable_ytabc:
        description: "Integrate YTABConfig"
        type: boolean
        required: true
        default: false

      enable_demc:
        description: "Integrate DontEatMyContent"
        type: boolean
        required: true
        default: false

      enable_ytweaks:
        description: "Integrate YTweaks (MaxTube)"
        type: boolean
        required: true
        default: false
        
      enable_gonerino:
        description: "Integrate Gonerino (MaxTube)"
        type: boolean
        required: true
        default: false

      enable_youspeed:
       description: "Integrate YouSpeed (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_ytlcm:
       description: "Integrate YTLowContrastMode (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_VolumeBoostYT:
       description: "Integrate VolumeBoostYT (not compatible with iOS 15; MaxTube)"
       type: boolean
       required: true
       default: false

      enable_YouGetCaption:
       description: "Integrate YouGetCaption (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_ytpf:
       description: "Integrate YTPlaybackFix, my tweak (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_ytpfBETA:
       description: "Integrate my YTPlaybackFix but latest beta version, at your own risk... (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_ycq:
       description: "Integrate YouChooseQuality (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_ys:
       description: "Integrate YouShare (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_youloop:
       description: "Integrate YouLoop (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_youmute:
       description: "Integrate YouMute (MaxTube)"
       type: boolean
       required: true
       default: false

      enable_ytlocalqueue:
        description: "Integrate YTLocalQueue (MaxTube)"
        type: boolean
        required: true
        default: false

      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      tweak_version:
        description: "The version of YTPlus to use. Versions that you can use are from 5.1 to 6.0 (no 5.2)"
        default: "6.0"
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tweaks:
    name: Build Tweaks
    uses: ./.github/workflows/_build_tweaks.yml
    with:
      enable_youpip: ${{ inputs.enable_youpip }}
      enable_ytuhd: ${{ inputs.enable_ytuhd }}
      enable_yq: ${{ inputs.enable_yq }}
      enable_ryd: ${{ inputs.enable_ryd }}
      enable_ytabc: ${{ inputs.enable_ytabc }}
      enable_demc: ${{ inputs.enable_demc }}
      enable_ytweaks: ${{ inputs.enable_ytweaks }}
      enable_gonerino: ${{ inputs.enable_gonerino }}
      enable_youspeed: ${{ inputs.enable_youspeed }}
      enable_ytlcm: ${{ inputs.enable_ytlcm }}
      enable_VolumeBoostYT: ${{ inputs.enable_VolumeBoostYT }}
      enable_YouGetCaption: ${{ inputs.enable_YouGetCaption }}
      enable_ytpf: ${{ inputs.enable_ytpf }}
      enable_ytpfBETA: ${{ inputs.enable_ytpfBETA }}
      enable_ycq: ${{ inputs.enable_ycq }}
      enable_ys: ${{ inputs.enable_ys }}
      enable_youloop: ${{ inputs.enable_youloop }}
      enable_youmute: ${{ inputs.enable_youmute }}
      enable_ytlocalqueue: ${{ inputs.enable_ytlocalqueue }}
      tweak_version: ${{ inputs.tweak_version }}


  package:
    name: Package IPA
    runs-on: macos-latest
    needs: build-tweaks
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6.0.2       
        with:
          repository: Mark02-2012/MaxTube 
          ref: main
          
      - name: Download built debs
        uses: actions/download-artifact@v8
        with:
          name: built-debs
          path: ${{ github.workspace }}

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name,enable_demc,enable_ryd,enable_ytabc,enable_youpip,enable_yq,enable_ytuhd,enable_ytweaks,enable_gonerino,enable_youspeed,enable_ytlcm,enable_VolumeBoostYT,enable_YouGetCaption,enable_ycq,enable_ys,enable_pdstm,enable_youloop,enable_youmute,enable_ytlocalqueue,info_note,tweak_version
          

      - name: Download and validate IPA
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose -O youtube.ipa
          file_type=$(file --mime-type -b youtube.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Get YouTube Version 
        run: |
          unzip -q youtube.ipa -d ytextracted
          echo "YT_VERSION=$(grep -A 1 '<key>CFBundleVersion</key>' ytextracted/Payload/YouTube.app/Info.plist | grep '<string>' | awk -F'[><]' '{print $3}')" >> $GITHUB_ENV

      - name: Determines the Release Title Prefix
        run: |
          if [ "${{ inputs.enable_ytweaks }}" = "false" ] && \
             [ "${{ inputs.enable_gonerino }}" = "false" ] && \
             [ "${{ inputs.enable_youspeed }}" = "false" ] && \
             [ "${{ inputs.enable_ytlcm }}" = "false" ] && \
             [ "${{ inputs.enable_VolumeBoostYT }}" = "false" ] && \
             [ "${{ inputs.enable_YouGetCaption }}" = "false" ] && \
             [ "${{ inputs.enable_ytpf }}" = "false" ] && \
             [ "${{ inputs.enable_ycq }}" = "false" ] && \
             [ "${{ inputs.enable_ys }}" = "false" ] && \
             [ "${{ inputs.enable_youloop }}" = "false" ] && \
             [ "${{ inputs.enable_youmute }}" = "false" ] && \
             [ "${{ inputs.enable_ytpfBETA }}" = "false" ]; then
            
            echo "RELEASE_PREFIX=YTPlus" >> $GITHUB_ENV
          else
            echo "RELEASE_PREFIX=MaxTube" >> $GITHUB_ENV
          fi

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject tweaks into IPA
        run: |
          tweaks="ytplus.deb OpenYoutubeSafariExtension.appex"
          for f in *.deb; do
            [ -f "$f" ] && tweaks="$tweaks $f"
          done
          cyan -i youtube.ipa -o ${{ env.RELEASE_PREFIX }}_${{ env.YT_VERSION }}_${{ inputs.tweak_version }}.ipa -uwef $tweaks -n "${{ inputs.display_name }}" -b ${{ inputs.bundle_id }}
  
      - name: Prepare Releases Notes
        run: |
          sed "s/%yt_version%/${{ env.YT_VERSION }}/g; s/%ytlite_version%/${{ inputs.tweak_version }}/g; s/%release_prefix%/${{ env.RELEASE_PREFIX }}/g" \
          .github/RELEASE_TEMPLATE/Release_Notes.md > release_notes_prepared.md

      - name: Prepare Releases Notes For iOS 15
        run: |
          if [ "${{ env.YT_VERSION }}" = "20.21.6" ]; then
          
          sed "s/%yt_version%/${{ env.YT_VERSION }}/g; s/%ytlite_version%/${{ inputs.tweak_version }}/g; s/%release_prefix%/${{ env.RELEASE_PREFIX }}/g" \
          .github/RELEASE_TEMPLATE/Release_Notes_YT20.21.6.md > release_notes_prepared_ios_15.md
          fi
          
      - name: Choose Releases Notes
        run: |
          if [ "${{ env.YT_VERSION }}" = "20.21.6" ]; then

           echo "NOTES_SELECTED=release_notes_prepared_ios_15.md" >> $GITHUB_ENV
          else
           echo "NOTES_SELECTED=release_notes_prepared.md" >> $GITHUB_ENV
          fi

      - name: Define compatibility app in release title
        run: |
          if [ "${{ env.YT_VERSION }}" = "20.21.6" ]; then

           echo "FOR_IOS15=(IOS 15+)" >> $GITHUB_ENV
          else 
           echo "FOR_IOS15=" >> $GITHUB_ENV
          fi

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tweak_version }}_${{ env.YT_VERSION }}(${{ github.run_number }})
          name: ${{ env.RELEASE_PREFIX }} ${{ inputs.tweak_version }} and ${{ env.YT_VERSION }} ${{ env.FOR_IOS15 }}
          files: ${{ env.RELEASE_PREFIX }}_${{ env.YT_VERSION }}_${{ inputs.tweak_version }}.ipa
          draft: false
          body_path: ${{ env.NOTES_SELECTED }}

      - name: Output Release URL
        run: |
          echo "::notice::🚀Build completed! Release available at: https://github.com/${{ github.repository }}/releases" 

      - name: Checkout source repository
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: main
          path: source-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update AltStore source
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          YT_VERSION: ${{ env.YT_VERSION }}
          TWEAK_VERSION: ${{ inputs.tweak_version }}
          IPA_FILE: ${{ env.RELEASE_PREFIX }}_${{ env.YT_VERSION }}_${{ inputs.tweak_version }}.ipa
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import quote

          repo = Path("source-repo/altstore.json")
          yt = os.environ["YT_VERSION"]
          tweak = os.environ["TWEAK_VERSION"]
          run = os.environ["RUN_NUMBER"]
          bundle = os.environ["BUNDLE_ID"]
          ipa = os.environ["IPA_FILE"]
          repository = os.environ["REPOSITORY"]

          tag = f"{tweak}_{yt}({run})"
          version = f"{yt}-{tweak}.{run}"

          download_url = (
              f"https://github.com/{repository}/releases/download/"
              f"{quote(tag, safe='')}/{quote(ipa, safe='')}"
          )

          ipa_path = Path(ipa)
          if not ipa_path.is_file():
              raise FileNotFoundError(f"IPA not found: {ipa}")

          data = {
              "name": "HaspSoftware MaxTube",
              "identifier": "com.haspsoftware.maxtube.source",
              "apps": [],
              "news": []
          }

          if repo.exists():
              data = json.loads(repo.read_text(encoding="utf-8"))

          app = next(
              (a for a in data["apps"]
               if a.get("bundleIdentifier") == bundle),
              None
          )

          if app is None:
              app = {
                  "name": "MaxTube",
                  "bundleIdentifier": bundle,
                  "developerName": "HaspSoftware",
                  "subtitle": "MaxTube for iOS",
                  "localizedDescription": "MaxTube IPA builds.",
                  "tintColor": "#E62117",
                  "category": "entertainment",
                  "versions": []
              }
              data["apps"].append(app)

          app["versions"].insert(0, {
              "version": version,
              "date": datetime.now(timezone.utc).isoformat(
                  timespec="seconds"
              ).replace("+00:00", "Z"),
              "downloadURL": download_url,
              "size": ipa_path.stat().st_size
          })

          repo.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )

          print("AltStore source updated:", download_url)
          PY

          git -C source-repo config user.name "github-actions[bot]"
          git -C source-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C source-repo add altstore.json

          if ! git -C source-repo diff --cached --quiet; then
            git -C source-repo commit -m "Update MaxTube AltStore source"
            git -C source-repo push origin HEAD:main
          fi
